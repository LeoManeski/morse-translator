<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Morse code translator</title>
    <style>
        body{
            font-family: -apple-system, sans-serif;
            max-width: 600px;
            margin:40px auto;
            padding:20px;
            background: #1a2e26;
            color: #e0e0e0;
        }
        h1{color: #fff;}
        label{
            display: block;
            margin:12px 0 6px;
            color:#888; 
        }
        textarea{
            width: 100%;
            padding:12px;
            font-size: 16px;
            border-radius: 8px;
            border:1px solid #333;
            background-color: #002512;
            color: #e0e0e0;
            box-sizing: border-box;
        }

        button{
            padding:10px 24px;
            font-size:16px;
            border-radius: 8px;
            border:none;
            background: #005825bc;
            color:#fff;
            cursor:pointer;
            margin-top:12px;
        }
    </style>
</head>

<body>
    <h1>Morse Code translator</h1>
    <label id="inputLabel">Text</label>
    <textarea id="input" rows="3" placeholder="type something..."></textarea>
    <button onclick="swapMode()" style="padding:6px 16px;font-size:20px;border-radius:8px;border:1px solid #333;background:#16213e;color:#6366f1;cursor:pointer;margin:12px 0;">⇄</button>
    <label id="outputLabel">Morse code</label>
    <textarea id="output" rows="3" readonly></textarea>
    <button onclick="playMorse()">Play</button>
    <div id="visual" style="min-height:60px;margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;"></div>
    <script src="wasm_exec.js"></script>
    <script>
        const go=new Go();
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result)=>{
            go.run(result.instance);
            document.getElementById("input").addEventListener("input", ()=>translate());
        });
    </script>
</body>
</html>
